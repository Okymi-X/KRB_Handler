[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "krb-handler"
dynamic = ["version"]
description = "Kerberos environment profile manager for authorized Active Directory assessments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Rafael Raugi (Avocado) - Caramelo Storm"}]
dependencies = []
keywords = ["active-directory", "kerberos", "security", "configuration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

[project.scripts]
krb-handler = "KRB_Handler:main"

[project.urls]
Repository = "https://github.com/Okymi-X/KRB_Handler"
Changelog = "https://github.com/Okymi-X/KRB_Handler/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["KRB_Handler"]

[tool.setuptools.dynamic]
version = {attr = "KRB_Handler.VERSION"}
